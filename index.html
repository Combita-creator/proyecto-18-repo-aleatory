<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>repo-aleatory</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main id="conteiner-main">

        <h1>Find Repository</h1>

        <div class="field">
            <!--Seleccionar el lenguaje-->
            <select name="language" id="language">
                    
                <option value="" disabled selected>select lenguage</option>
                <option value="JavaScript">JavaScript</option>
                <option value="Java">Java</option>
                <option value="Python">Python</option>
                <option value="C++">C++</option>
                <option value="Rust">Rust</option>

            </select>
        </div>

        <!--Barra de estado en donde aparecer el repo-->
        <div id="state-container" class="state-container">


        </div>

        <!--Boton para refrescar el repo-->
        <button id="btn-refresh" class="button-refresh">Refresh</button>

        <script src="script.js"></script>
    </main>
</body>

</html>
